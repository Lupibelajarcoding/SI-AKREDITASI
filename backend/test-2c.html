<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SI-Akreditasi 2.C - Fleksibilitas Pembelajaran</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        table { border-collapse: collapse; width: 100%; font-size: 0.7rem; }
        th, td { border: 1px solid #e2e8f0; padding: 10px; text-align: center; }
        th { background-color: #f8fafc; text-transform: uppercase; letter-spacing: 0.05em; }
        .bg-lkps-header { background-color: #d1d5db; }
        .bg-lkps-summary { background-color: #fef08a; }
        .tab-active { border-bottom: 4px solid #2563eb; color: #2563eb; font-weight: 800; }
        .input-group-label { font-size: 0.6rem; font-weight: 800; color: #64748b; letter-spacing: 0.05em; margin-bottom: 4px; text-transform: uppercase; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans">

    <!-- Screen 1: Login -->
    <div id="login-screen" class="flex items-center justify-center min-h-screen">
        <div class="bg-white p-10 rounded-2xl shadow-2xl w-96 border-t-8 border-blue-600">
            <div class="flex justify-center mb-6">
                <div class="w-20 h-20 bg-blue-600 rounded-3xl flex items-center justify-center text-white text-3xl font-black shadow-xl">ST</div>
            </div>
            <h1 class="text-2xl font-bold text-center mb-1 text-slate-800">SI-Akreditasi</h1>
            <p class="text-[10px] text-slate-400 text-center mb-8 uppercase font-bold tracking-[0.2em]">Management System 2.C</p>
            <form onsubmit="event.preventDefault(); handleLogin();" class="space-y-4">
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">Username</label>
                    <input type="text" id="username" required placeholder="admin / prodi" class="w-full p-3 border rounded-xl bg-slate-50 font-semibold focus:ring-2 focus:ring-blue-500 outline-none transition">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">Password</label>
                    <input type="password" id="password" required placeholder="********" class="w-full p-3 border rounded-xl bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none transition">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-xl shadow-lg active:scale-95 transition mt-4 uppercase text-xs tracking-widest">Masuk Ke Sistem</button>
            </form>
            <div id="login-error" class="hidden mt-6 p-3 bg-red-50 text-red-600 text-[10px] text-center rounded-xl font-bold uppercase border border-red-100"></div>
        </div>
    </div>

    <!-- Screen 2: Main Dashboard -->
    <div id="main-content" class="hidden p-6">
        <div class="max-w-[98%] mx-auto bg-white p-8 rounded-3xl shadow-xl border border-slate-200">
            
            <!-- Header Navigation -->
            <div class="flex justify-between items-center mb-8 border-b border-slate-100 pb-6">
                <div class="flex items-center gap-5">
                    <div class="w-12 h-12 bg-blue-600 rounded-xl flex items-center justify-center text-white font-bold text-2xl shadow-lg shadow-blue-200">ST</div>
                    <div>
                        <h1 class="text-xl font-black text-slate-800 tracking-tight uppercase">Manajemen Tabel 2.C</h1>
                        <p class="text-[11px] text-slate-400 font-bold uppercase tracking-widest">
                            Akun: <span id="user-info" class="text-blue-600 lowercase"></span> | 
                            Unit Kerja: <span id="display-role" class="text-slate-800 bg-slate-100 px-2 py-0.5 rounded ml-1"></span>
                        </p>
                    </div>
                </div>
                <div class="flex items-center gap-6">
                    <nav class="flex gap-4">
                        <button onclick="switchTab('main')" id="tab-main" class="px-2 py-3 text-xs font-black tracking-widest transition tab-active uppercase">Dashboard</button>
                        <button onclick="switchTab('trash')" id="tab-trash" class="px-2 py-3 text-xs font-black tracking-widest text-slate-300 hover:text-red-500 transition relative uppercase">
                            Trash 
                            <span id="trash-count" class="ml-1 bg-red-500 text-white px-1.5 rounded-full text-[8px]">0</span>
                        </button>
                    </nav>
                    <button onclick="handleLogout()" class="bg-red-50 text-red-600 px-6 py-2.5 rounded-xl text-[10px] font-black tracking-widest border border-red-100 hover:bg-red-100 transition shadow-sm uppercase">Logout</button>
                </div>
            </div>

            <!-- Dashboard View -->
            <div id="view-main" class="grid grid-cols-1 lg:grid-cols-5 gap-8">
                <!-- Sidebar Form -->
                <div class="lg:col-span-1 bg-slate-50 p-6 rounded-2xl border border-slate-200">
                    <h2 class="text-[11px] font-black mb-6 text-slate-400 uppercase tracking-[0.2em] flex items-center gap-2">
                        <span class="w-1.5 h-6 bg-blue-600 rounded-full"></span>
                        Filter & Matrix
                    </h2>
                    <div class="space-y-5">
                        <div>
                            <label class="input-group-label ml-1">Program Studi</label>
                            <select id="id_prodi" class="w-full p-3 border rounded-xl text-[11px] font-bold text-slate-700 bg-white outline-none focus:border-blue-500">
                                <option value="1">Teknik Informatika (S1)</option>
                                <option value="2">Manajemen Informatika (D3)</option>
                            </select>
                        </div>
                        <div>
                            <label class="input-group-label ml-1">Tahun Akademik (TS)</label>
                            <select id="id_tahun" onchange="loadData()" class="w-full p-3 border rounded-xl text-[11px] font-bold text-slate-700 bg-white outline-none focus:border-blue-500">
                                <option value="">Memuat...</option>
                            </select>
                        </div>
                        <button onclick="saveAll()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-black shadow-xl active:scale-95 transition text-[11px] tracking-widest uppercase mt-4">Simpan Semua Perubahan</button>
                    </div>
                </div>

                <!-- Table View -->
                <div class="lg:col-span-4">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-xs font-black text-slate-700 uppercase tracking-[0.2em] italic">Preview Laporan Fleksibilitas Pembelajaran (2.C)</h2>
                        <button onclick="exportExcel()" class="bg-green-600 text-white px-6 py-2.5 rounded-xl text-[10px] font-black hover:bg-green-700 transition shadow-lg flex items-center gap-2 uppercase tracking-widest">
                            Export Excel
                        </button>
                    </div>
                    <table class="shadow-2xl rounded-xl overflow-hidden w-full border-collapse">
                        <thead id="main-thead" class="bg-slate-800 text-white">
                            <!-- Header akan diisi secara dinamis oleh JavaScript -->
                        </thead>
                        <tbody id="main-tbody" class="bg-white">
                            <!-- Data akan diisi secara dinamis oleh JavaScript -->
                        </tbody>
                        <tfoot id="main-tfoot" class="bg-slate-100 font-black">
                            <!-- Summary akan diisi secara dinamis oleh JavaScript -->
                        </tfoot>
                    </table>
                </div>
            </div>

            <!-- Trash View -->
            <div id="view-trash" class="hidden">
                <div class="bg-red-50 p-8 rounded-3xl border border-red-100 mb-8">
                    <h3 class="text-sm font-black text-red-700 uppercase tracking-widest">Tempat Sampah (2.C)</h3>
                </div>
                <table class="w-full">
                    <thead>
                        <tr class="bg-slate-100 text-[10px] font-black uppercase text-slate-500">
                            <th>ID</th><th>Bentuk Pembelajaran</th><th>Tahun</th><th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="trash-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = "http://localhost:5000/api";
        let session = { token: null, unit: null, username: null, userId: null };

        async function handleLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            try {
                const res = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const result = await res.json();
                if (result.success) {
                    session = { token: result.token, unit: result.user.unit, username: result.user.username, userId: result.user.id_user };
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('main-content').classList.remove('hidden');
                    document.getElementById('display-role').innerText = session.unit;
                    document.getElementById('user-info').innerText = session.username;
                    await loadTahun();
                    loadData();
                } else {
                    document.getElementById('login-error').innerText = result.message;
                    document.getElementById('login-error').classList.remove('hidden');
                }
            } catch (err) { alert("Server error"); }
        }

        function handleLogout() { location.reload(); }

        async function loadTahun() {
            const res = await fetch(`${API_BASE}/master/tahun-akademik`, { headers: { 'Authorization': `Bearer ${session.token}` } });
            const result = await res.json();
            const select = document.getElementById('id_tahun');
            select.innerHTML = result.data.map(t => `<option value="${t.id_tahun}">${t.tahun}</option>`).join('');
        }

        async function loadData() {
            const id_prodi = document.getElementById('id_prodi').value;
            const id_tahun = document.getElementById('id_tahun').value;
            const res = await fetch(`${API_BASE}/prodi/2c-fleksibilitas?id_prodi=${id_prodi}&id_tahun=${id_tahun}`, {
                headers: { 'Authorization': `Bearer ${session.token}` }
            });
            const result = await res.json();
            renderTable(result);
            loadTrashCount();
        }

        function renderTable(result) {
            const thead = document.getElementById('main-thead');
            const tbody = document.getElementById('main-tbody');
            const tfoot = document.getElementById('main-tfoot');

            // 1. Header Dinamis
            thead.innerHTML = `
                <tr class="bg-lkps-header text-slate-800 font-black uppercase text-[10px] tracking-widest border-b-2 border-slate-400">
                    <th class="p-4 text-left border-r border-slate-300">Tahun Akademik</th>
                    ${result.years.map(y => `<th class="p-4 text-center border-r border-slate-300 w-32">${y.label} (${y.tahun})</th>`).join('')}
                    <th class="p-4 text-center">Link Bukti</th>
                </tr>
            `;

            // 2. Baris Mahasiswa Aktif
            let html = `
                <tr class="bg-white font-bold border-b border-slate-300 shadow-inner">
                    <td class="p-4 text-left border-r border-slate-300 bg-slate-50">Jumlah Mahasiswa Aktif</td>
                    ${result.summary.map(s => `<td class="p-4 text-center border-r border-slate-300 text-blue-700 bg-blue-50/20">${s.total_mhs_aktif}</td>`).join('')}
                    <td class="bg-slate-50"></td>
                </tr>
                <tr class="bg-lkps-header/50 font-black text-[9px] uppercase tracking-[0.2em] border-b border-slate-400">
                    <td class="p-3 text-left border-r border-slate-300">Bentuk Pembelajaran</td>
                    <td colspan="${result.years.length}" class="p-3 text-center border-r border-slate-300 italic text-slate-500">Jumlah mahasiswa untuk setiap bentuk pembelajaran</td>
                    <td></td>
                </tr>
            `;

            // 3. Baris Data (Kuning)
            result.data.forEach((r) => {
                html += `
                    <tr class="hover:bg-yellow-50 transition border-b border-slate-200" data-id-bentuk="${r.id_bentuk}">
                        <td class="p-4 text-left font-semibold text-slate-700 border-r border-slate-300 bg-slate-50/50">${r.nama_bentuk}</td>
                        ${result.years.map(y => `
                            <td class="p-0 border-r border-slate-300 bg-lkps-summary">
                                <input type="number" 
                                       class="val-mhs w-full h-12 bg-lkps-summary p-2 text-center font-black text-slate-800 border-none outline-none focus:bg-white focus:ring-inset focus:ring-2 focus:ring-blue-400 transition" 
                                       data-id-tahun="${y.id_tahun}"
                                       value="${r.values[y.id_tahun] || 0}">
                            </td>
                        `).join('')}
                        <td class="p-0 bg-lkps-summary">
                            <input type="text" 
                                   class="val-link w-full h-12 bg-lkps-summary p-2 text-[10px] border-none outline-none focus:bg-white focus:ring-inset focus:ring-2 focus:ring-blue-400 transition" 
                                   placeholder="URL Bukti..."
                                   value="${r.link_bukti || ''}">
                        </td>
                    </tr>`;
            });

            tbody.innerHTML = html;

            // 4. Footer (Summary)
            tfoot.innerHTML = `
                <tr class="bg-slate-100 font-black border-t-2 border-slate-400">
                    <td class="p-4 text-left border-r border-slate-300 uppercase tracking-widest text-[9px]">Jumlah</td>
                    ${result.summary.map(s => `<td class="p-4 text-center border-r border-slate-300 text-slate-900">${s.total_mhs_bentuk}</td>`).join('')}
                    <td class="bg-slate-50"></td>
                </tr>
                <tr class="bg-slate-200 font-black border-b border-slate-300">
                    <td class="p-4 text-left border-r border-slate-300 uppercase tracking-widest text-[9px]">Persentase (%)</td>
                    ${result.summary.map(s => `<td class="p-4 text-center border-r border-slate-300 text-blue-700 text-xs">${s.persentase}</td>`).join('')}
                    <td class="bg-slate-100"></td>
                </tr>
            `;
        }

        async function saveAll() {
            const id_prodi = document.getElementById('id_prodi').value;
            const id_tahun_ts = document.getElementById('id_tahun').value; // Ini tahun acuan (TS)
            
            const details = [];
            document.querySelectorAll('#main-tbody tr[data-id-bentuk]').forEach(row => {
                const id_bentuk = row.dataset.idBentuk;
                const link_bukti = row.querySelector('.val-link').value;
                
                row.querySelectorAll('.val-mhs').forEach(input => {
                    details.push({
                        id_bentuk: id_bentuk,
                        id_tahun: input.dataset.idTahun,
                        jumlah_mhs: input.value,
                        // Hanya simpan link_bukti jika input ini adalah untuk tahun acuan (TS)
                        // Atau kita simpan link yang sama untuk semua tahun di baris tersebut
                        link_bukti: link_bukti 
                    });
                });
            });

            const res = await fetch(`${API_BASE}/prodi/2c-fleksibilitas`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.token}` },
                body: JSON.stringify({ id_prodi, id_tahun: id_tahun_ts, details })
            });
            const result = await res.json();
            if(result.success) loadData();
            alert(result.message);
        }

        async function softDelete(id) {
            if(!id) return alert("Data belum tersimpan");
            await fetch(`${API_BASE}/prodi/2c-fleksibilitas/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${session.token}` }
            });
            loadData();
        }

        function switchTab(t) {
            document.getElementById('view-main').classList.toggle('hidden', t !== 'main');
            document.getElementById('view-trash').classList.toggle('hidden', t !== 'trash');
            if(t === 'trash') loadTrash();
        }

        async function loadTrash() {
            const id_prodi = document.getElementById('id_prodi').value;
            const res = await fetch(`${API_BASE}/prodi/2c-fleksibilitas/trash?id_prodi=${id_prodi}`, {
                headers: { 'Authorization': `Bearer ${session.token}` }
            });
            const result = await res.json();
            const tbody = document.getElementById('trash-tbody');
            tbody.innerHTML = result.data.map(r => `
                <tr>
                    <td>${r.id_2c}</td><td>${r.nama_bentuk}</td><td>${r.id_tahun}</td>
                    <td><button onclick="restore(${r.id_2c})" class="bg-blue-600 text-white px-4 py-1 rounded text-[10px] font-black">RESTORE</button></td>
                </tr>
            `).join('');
        }

        async function restore(id) {
            await fetch(`${API_BASE}/prodi/2c-fleksibilitas/restore/${id}`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${session.token}` }
            });
            loadTrash();
            loadData();
        }

        async function loadTrashCount() {
            const id_prodi = document.getElementById('id_prodi').value;
            const res = await fetch(`${API_BASE}/prodi/2c-fleksibilitas/trash?id_prodi=${id_prodi}`, {
                headers: { 'Authorization': `Bearer ${session.token}` }
            });
            const result = await res.json();
            document.getElementById('trash-count').innerText = result.data.length;
        }

        function exportExcel() {
            const id_prodi = document.getElementById('id_prodi').value;
            const id_tahun = document.getElementById('id_tahun').value;
            window.open(`${API_BASE}/prodi/2c-fleksibilitas/export?id_prodi=${id_prodi}&id_tahun=${id_tahun}&token=${session.token}`, '_blank');
        }
    </script>
</body>
</html>
